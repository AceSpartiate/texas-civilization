<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read Aloud</title>
<style>
  :root {
    --bg: #f6f1e7; --panel: #fffdf8; --ink: #2b2118; --muted: #6d5f50; --line: #d9ccb6;
    --accent: #8a3b12; --accent-ink: #fff;
    --c0: #e5efe0; --c1: #f4e2d6; --c2: #dfe8f3; --c3: #f6ecc8; --c4: #ebe0f0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.3 "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  .voices { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .label { color: var(--muted); font-size: 14px; }
  button, select, input, textarea { font: inherit; color: inherit; }
  .toggle { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .toggle small { color: var(--muted); }
  .toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .toggle[aria-pressed="true"] small { color: #f3d9c7; }
  select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--panel); }
  .speed { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  #status { font-size: 14px; color: var(--muted); min-width: 10ch; }
  #status.err { color: #b3261e; }
  main { overflow: auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 10px; }
  .preset { min-height: 78px; padding: 10px; border-radius: 12px; border: 1px solid rgba(0,0,0,.08); cursor: pointer;
    font-size: 17px; font-weight: 600; text-align: center; box-shadow: 0 1px 0 rgba(0,0,0,.06);
    transition: transform .06s, box-shadow .06s; }
  .preset:hover { box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .preset:active { transform: scale(.97); }
  .preset.playing { outline: 3px solid var(--accent); outline-offset: 1px; }
  .preset.r0 { background: var(--c0); } .preset.r1 { background: var(--c1); } .preset.r2 { background: var(--c2); }
  .preset.r3 { background: var(--c3); } .preset.r4 { background: var(--c4); }
  footer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); align-items: stretch; }
  textarea { flex: 1; resize: none; height: 64px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; font-size: 18px; }
  textarea:focus { outline: 2px solid var(--accent); }
  .btn { border: 1px solid var(--line); border-radius: 10px; padding: 0 18px; background: var(--bg); cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 18px; padding: 0 26px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .missing { margin: 16px; padding: 14px; border: 1px solid #b3261e; border-radius: 10px; background: #fdecea; display: none; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    footer { flex-wrap: wrap; } textarea { flex-basis: 100%; } .btn { min-height: 44px; flex: 1; }
  }
</style>
</head>
<body>
<header>
  <h1>Read Aloud</h1>
  <div class="voices" role="group" aria-label="Voice">
    <span class="label">Voice:</span>
    <span id="cast" class="voices"></span>
    <select id="more" aria-label="More voices"></select>
    <button id="auto" class="toggle" aria-pressed="false"
      title="Reads each sentence in a woman's or a man's voice when the words say who is speaking: a quotation's speaker (&quot;said Mom&quot;), a label (&quot;Dad: ...&quot;), or a reader who says who they are (&quot;I am a mother&quot;). Anything else is read in the chosen voice.">Auto voice <small id="autoState">off</small></button>
  </div>
  <label class="speed"><span class="label">Speed</span>
    <input id="speed" type="range" min="0.6" max="1.5" step="0.05" value="1">
    <span id="speedOut">1.00×</span>
  </label>
  <span id="status" aria-live="polite"></span>
</header>
<main>
  <div id="missing" class="missing"></div>
  <div id="grid" class="grid"></div>
</main>
<footer>
  <textarea id="text" placeholder="Type anything here, then press Speak (or Enter). Shift+Enter makes a new line." aria-label="Text to read aloud"></textarea>
  <button id="speak" class="btn primary">Speak</button>
  <button id="pause" class="btn" disabled>Pause</button>
  <button id="stop" class="btn" disabled>Stop</button>
  <button id="again" class="btn" disabled>Repeat</button>
  <button id="clear" class="btn">Clear</button>
</footer>
<script type="module">
import { assignSpeakers } from '/gender.mjs';
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let voices = [], voice = store.get('ra.voice') || 'af_heart', speed = Number(store.get('ra.speed')) || 1;
let auto = store.get('ra.auto') === '1';
let run = 0, audio = null, last = '', playingEl = null;

// Auto voice: a woman's line in the chosen voice if it is a woman's, else Kore (the game's woman); a man's line in
// the chosen voice if it is a man's, else Puck (the game's man). A line with no speaker keeps the chosen voice.
const isWoman = id => id[1] === 'f';
function voiceFor(gender) {
  if (!auto || !gender) return voice;
  if (gender === 'female') return isWoman(voice) ? voice : 'af_kore';
  return isWoman(voice) ? 'am_puck' : voice;
}
function setAuto(on) {
  auto = on; store.set('ra.auto', on ? '1' : '0');
  $('auto').setAttribute('aria-pressed', String(on)); $('autoState').textContent = on ? 'on' : 'off';
  if (on) fetch('/warm', { method: 'POST', body: JSON.stringify({ voice: voiceFor(isWoman(voice) ? 'male' : 'female'), speed }) }).catch(() => {});
}
const nameOf = id => voices.find(v => v.id === id)?.name || id;

function status(msg, err) { $('status').textContent = msg || ''; $('status').className = err ? 'err' : ''; }

function setVoice(id) {
  voice = id; store.set('ra.voice', id);
  for (const b of $('cast').children) b.setAttribute('aria-pressed', String(b.dataset.id === id));
  $('more').value = voices.some(v => v.id === id && !v.game) ? id : '';
  warm();
}
function warm() { fetch('/warm', { method: 'POST', body: JSON.stringify({ voice, speed }) }).catch(() => {}); }

// Sentences go to the voice one at a time, so the first one plays while the rest are still being made.
async function fetchWav({ text, voice }) {
  const r = await fetch('/speak', { method: 'POST', body: JSON.stringify({ text, voice, speed }) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
  return URL.createObjectURL(await r.blob());
}
function playUrl(url, mine) {
  return new Promise(resolve => {
    if (mine !== run) return resolve();
    audio = new Audio(url);
    audio.onended = audio.onerror = () => { URL.revokeObjectURL(url); resolve(); };
    audio.play().catch(resolve);
  });
}
async function read(text, el) {
  text = text.trim();
  if (!text) return;
  stop();
  const mine = ++run;
  last = text; $('again').disabled = false; $('stop').disabled = false; $('pause').disabled = false;
  if (el) { playingEl = el; el.classList.add('playing'); }
  const parts = assignSpeakers(text).map(p => ({ ...p, voice: voiceFor(p.gender) }));
  if (!parts.length) return finish();
  try {
    let next = fetchWav(parts[0]);
    for (let i = 0; i < parts.length && mine === run; i++) {
      const p = parts[i];
      status(auto ? (p.gender ? `Auto: ${nameOf(p.voice)}, ${p.gender === 'female' ? 'a woman' : 'a man'} (${p.why})`
        : `Auto: ${nameOf(p.voice)}, no speaker named`) : 'Reading…');
      const url = await next;
      next = i + 1 < parts.length ? fetchWav(parts[i + 1]) : null;
      next?.catch(() => {});
      await playUrl(url, mine);
    }
    if (mine === run) status('');
  } catch (e) { if (mine === run) status(e.message, true); }
  if (mine === run) finish();
}
function finish() {
  playingEl?.classList.remove('playing'); playingEl = null;
  $('stop').disabled = true; $('pause').disabled = true; $('pause').textContent = 'Pause';
}
function stop() {
  run++;
  if (audio) { audio.pause(); audio = null; }
  finish(); status('');
}

$('speak').onclick = () => read($('text').value);
$('stop').onclick = stop;
$('again').onclick = () => read(last);
$('clear').onclick = () => { $('text').value = ''; $('text').focus(); };
$('pause').onclick = () => {
  if (!audio) return;
  if (audio.paused) { audio.play(); $('pause').textContent = 'Pause'; }
  else { audio.pause(); $('pause').textContent = 'Resume'; }
};
$('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); read($('text').value); }
  if (e.key === 'Escape') stop();
});
$('speed').value = speed; $('speedOut').textContent = speed.toFixed(2) + '×';
$('speed').oninput = () => { $('speedOut').textContent = Number($('speed').value).toFixed(2) + '×'; };
$('speed').onchange = () => { speed = Number($('speed').value); store.set('ra.speed', speed); warm(); };
$('auto').onclick = () => setAuto(!auto);
$('more').onchange =() => { if ($('more').value) setVoice($('more').value); };

fetch('/config').then(r => r.json()).then(cfg => {
  voices = cfg.voices;
  for (const v of voices.filter(v => v.game)) {
    const b = document.createElement('button');
    b.className = 'toggle'; b.dataset.id = v.id; b.title = `${v.who}: ${v.game}`;
    b.innerHTML = `${v.name} <small>${v.who.split(' ')[1]}</small>`;
    b.onclick = () => setVoice(v.id);
    $('cast').append(b);
  }
  $('more').innerHTML = '<option value="">More voices…</option>' +
    voices.filter(v => !v.game).map(v => `<option value="${v.id}">${v.name} (${v.who})</option>`).join('');
  cfg.presets.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = `preset r${Math.floor(i / 10) % 5}`; b.textContent = p;
    b.onclick = () => read(p, b);
    $('grid').append(b);
  });
  if (!cfg.ready) {
    $('missing').style.display = 'block';
    $('missing').textContent = `The voices were not found at ${cfg.runtime}. Copy the game's runtime\\voice folder there, or set READ_ALOUD_VOICE_DIR.`;
  }
  setVoice(voices.some(v => v.id === voice) ? voice : 'af_heart');
  setAuto(auto);
  $('text').focus();
}).catch(e => status('Could not reach the Read Aloud program: ' + e.message, true));
</script>
</body>
</html>
