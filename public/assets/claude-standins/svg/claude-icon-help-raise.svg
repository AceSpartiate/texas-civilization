<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-help-raise: two hands, two sleeves, lifting a log together. Claude-drawn stand-in; replace with Astra's
       icon-help-raise (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="raise-log" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c49463"/><stop offset="0.5" stop-color="#8c6238"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <radialGradient id="raise-end" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#e8c898"/><stop offset="1" stop-color="#b8875a"/></radialGradient>
    <linearGradient id="raise-sleeve1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9512d"/><stop offset="1" stop-color="#6e2f18"/></linearGradient>
    <linearGradient id="raise-sleeve2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f7f8f"/><stop offset="1" stop-color="#3c4a58"/></linearGradient>
    <linearGradient id="raise-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6b98c"/><stop offset="1" stop-color="#b8845a"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the two arms coming up from below, one each side -->
    <path d="M 14 124 L 30 124 L 40 78 L 20 74 Z" fill="url(#raise-sleeve1)" stroke-width="3"/>
    <path d="M 98 124 L 114 124 L 108 74 L 88 78 Z" fill="url(#raise-sleeve2)" stroke-width="3"/>
    <!-- the log held up across -->
    <path d="M 16 34 L 112 34 L 112 62 L 16 62 Z" fill="url(#raise-log)" stroke-width="3"/>
    <ellipse cx="16" cy="48" rx="9" ry="14" fill="url(#raise-end)" stroke-width="3"/>
    <ellipse cx="16" cy="48" rx="4.5" ry="7" fill="none" stroke="#a5784b" stroke-width="1.4" opacity="0.7"/>
    <path d="M 28 39 L 106 39" fill="none" stroke="#e8c898" stroke-width="2.2" opacity="0.7"/>
    <path d="M 30 56 L 100 56" fill="none" stroke="#4b3018" stroke-width="1.8" opacity="0.6"/>
    <!-- the hands gripping under the log, fingers over the front -->
    <path d="M 22 74 Q 24 60 36 58 L 50 58 Q 56 60 54 68 Q 52 76 44 78 Q 32 82 22 74 Z" fill="url(#raise-skin)" stroke-width="2.8"/>
    <path d="M 36 58 L 34 70 M 43 58 L 42 72" fill="none" stroke="#9a6a44" stroke-width="1.6" opacity="0.7"/>
    <path d="M 106 74 Q 104 60 92 58 L 78 58 Q 72 60 74 68 Q 76 76 84 78 Q 96 82 106 74 Z" fill="url(#raise-skin)" stroke-width="2.8"/>
    <path d="M 92 58 L 94 70 M 85 58 L 86 72" fill="none" stroke="#9a6a44" stroke-width="1.6" opacity="0.7"/>
    <path d="M 26 66 Q 30 62 36 61" fill="none" stroke="#f6d9b8" stroke-width="1.8" opacity="0.8"/>
    <path d="M 78 62 Q 84 60 90 61" fill="none" stroke="#f6d9b8" stroke-width="1.8" opacity="0.8"/>
  </g>
</svg>
