<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-visit: two cabins with a path between them, a neighbour's place. Claude-drawn stand-in; replace with Astra's
       icon-visit (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="visit-logs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#7a5534"/></linearGradient>
    <linearGradient id="visit-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c6a44"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="visit-path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ad7a"/><stop offset="1" stop-color="#9c7f52"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the path, winding from the near cabin at the lower left to the far one at the upper right -->
    <path d="M 30 116 Q 70 112 68 84 Q 66 60 100 52" fill="none" stroke="#1a0e08" stroke-width="14"/>
    <path d="M 30 116 Q 70 112 68 84 Q 66 60 100 52" fill="none" stroke="url(#visit-path)" stroke-width="9"/>
    <!-- the far cabin, small -->
    <path d="M 104 10 L 111 10 L 111 28 L 104 28 Z" fill="#8a7a66" stroke-width="2.2"/>
    <path d="M 74 34 L 96 14 L 118 34 Z" fill="url(#visit-roof)" stroke-width="2.6"/>
    <path d="M 78 34 L 114 34 L 114 56 L 78 56 Z" fill="url(#visit-logs)" stroke-width="2.6"/>
    <path d="M 78 40 L 114 40 M 78 46 L 114 46 M 78 52 L 114 52" fill="none" stroke="#5e3d1e" stroke-width="1.5" opacity="0.7"/>
    <path d="M 90 56 L 90 44 L 100 44 L 100 56 Z" fill="#2a1a10" stroke-width="2"/>
    <!-- the near cabin, larger -->
    <path d="M 48 50 L 58 50 L 58 76 L 48 76 Z" fill="#8a7a66" stroke-width="2.6"/>
    <path d="M 4 84 L 34 56 L 64 84 Z" fill="url(#visit-roof)" stroke-width="3"/>
    <path d="M 10 84 L 58 84 L 58 116 L 10 116 Z" fill="url(#visit-logs)" stroke-width="3"/>
    <path d="M 10 92 L 58 92 M 10 100 L 58 100 M 10 108 L 58 108" fill="none" stroke="#5e3d1e" stroke-width="1.8" opacity="0.7"/>
    <path d="M 26 116 L 26 96 L 42 96 L 42 116 Z" fill="#2a1a10" stroke-width="2.6"/>
    <path d="M 8 82 L 34 58" fill="none" stroke="#b08a5c" stroke-width="2" opacity="0.7"/>
    <path d="M 78 34 L 96 16" fill="none" stroke="#b08a5c" stroke-width="1.6" opacity="0.7"/>
  </g>
</svg>
