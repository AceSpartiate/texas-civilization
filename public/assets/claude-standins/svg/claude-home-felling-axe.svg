    <path d="M 114 130 Q 120 142 120 152" fill="none" stroke="#e6e8e2" stroke-width="2.6" opacity="0.9"/>
    <path d="M 72 124 L 92 122" fill="none" stroke="#c6c8c2" stroke-width="2" opacity="0.7"/>
