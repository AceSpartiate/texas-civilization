<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-fell-trees: an axe buried in a standing trunk, the notch cut and chips flying. Claude-drawn stand-in; replace
       with Astra's icon-fell-trees (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="fell-trunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a7048"/><stop offset="0.5" stop-color="#6a4525"/><stop offset="1" stop-color="#3a2412"/></linearGradient>
    <radialGradient id="fell-leaf" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#8faa52"/><stop offset="0.6" stop-color="#5f7a34"/><stop offset="1" stop-color="#34471c"/></radialGradient>
    <linearGradient id="fell-head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0a29c"/><stop offset="0.5" stop-color="#6a6c68"/><stop offset="1" stop-color="#2f312e"/></linearGradient>
    <linearGradient id="fell-handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#6a4525"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the canopy above -->
    <ellipse cx="74" cy="26" rx="40" ry="22" fill="url(#fell-leaf)" stroke-width="3"/>
    <path d="M 44 18 Q 58 6 76 8" fill="none" stroke="#b6cf7a" stroke-width="2.2" opacity="0.8"/>
    <!-- the trunk, with the notch already cut on the near side -->
    <path d="M 62 40 L 88 40 L 92 122 L 58 122 L 60 90 L 74 82 L 60 70 Z" fill="url(#fell-trunk)" stroke-width="3"/>
    <path d="M 60 70 L 74 82 L 60 90 Z" fill="#e8c898" stroke-width="2.4"/>
    <path d="M 66 46 L 66 66 M 66 96 L 66 116" fill="none" stroke="#c49463" stroke-width="2" opacity="0.6"/>
    <path d="M 84 46 L 86 116" fill="none" stroke="#2a1a10" stroke-width="2" opacity="0.6"/>
    <!-- the ground -->
    <path d="M 20 122 L 118 122" fill="none" stroke="#5f7a34" stroke-width="4"/>
    <!-- the axe, driven into the notch from the left -->
    <path d="M 10 118 L 56 84" fill="none" stroke="#1a0e08" stroke-width="10"/>
    <path d="M 10 118 L 56 84" fill="none" stroke="url(#fell-handle)" stroke-width="6"/>
    <g transform="rotate(-36 58 82)">
      <path d="M 52 66 L 66 66 Q 82 72 82 92 Q 72 86 66 90 L 52 90 Z" fill="url(#fell-head)" stroke-width="3"/>
      <path d="M 76 76 Q 80 84 80 90" fill="none" stroke="#e6e8e2" stroke-width="2.4" opacity="0.9"/>
    </g>
    <!-- chips -->
    <path d="M 40 66 L 48 60 M 34 78 L 42 76 M 100 96 L 108 92" fill="none" stroke="#d9b27a" stroke-width="4"/>
  </g>
</svg>
