<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-buy-furniture: a finished rocking chair with a coin at its foot. Claude-drawn stand-in; replace with Astra's
       icon-buy-furniture (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="buyf-wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b27a"/><stop offset="0.5" stop-color="#a5784b"/><stop offset="1" stop-color="#5e3d1e"/></linearGradient>
    <linearGradient id="buyf-rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#6a4525"/></linearGradient>
    <radialGradient id="buyf-coin" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#f6dc80"/><stop offset="0.6" stop-color="#d4a83a"/><stop offset="1" stop-color="#8a5f12"/></radialGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the rockers -->
    <path d="M 14 108 Q 50 124 96 104" fill="none" stroke="#1a0e08" stroke-width="9"/>
    <path d="M 14 108 Q 50 124 96 104" fill="none" stroke="url(#buyf-rail)" stroke-width="5"/>
    <!-- legs -->
    <path d="M 30 74 L 26 110 M 78 74 L 82 108" fill="none" stroke="#1a0e08" stroke-width="10"/>
    <path d="M 30 74 L 26 110 M 78 74 L 82 108" fill="none" stroke="url(#buyf-rail)" stroke-width="6"/>
    <!-- the seat -->
    <path d="M 22 66 L 86 66 L 92 82 L 16 82 Z" fill="url(#buyf-wood)" stroke-width="3"/>
    <path d="M 26 70 L 82 70" fill="none" stroke="#f0d8b0" stroke-width="2" opacity="0.8"/>
    <!-- the back: two posts and spindles, a curved top rail -->
    <path d="M 28 68 L 34 10 M 80 68 L 74 10" fill="none" stroke="#1a0e08" stroke-width="10"/>
    <path d="M 28 68 L 34 10 M 80 68 L 74 10" fill="none" stroke="url(#buyf-rail)" stroke-width="6"/>
    <path d="M 44 66 L 46 26 M 56 66 L 56 24 M 66 66 L 64 26" fill="none" stroke="#1a0e08" stroke-width="7"/>
    <path d="M 44 66 L 46 26 M 56 66 L 56 24 M 66 66 L 64 26" fill="none" stroke="#c49463" stroke-width="3.5"/>
    <path d="M 30 16 Q 54 4 78 16 L 76 26 Q 54 16 32 26 Z" fill="url(#buyf-wood)" stroke-width="3"/>
    <!-- arms -->
    <path d="M 22 46 L 92 46" fill="none" stroke="#1a0e08" stroke-width="9"/>
    <path d="M 22 46 L 92 46" fill="none" stroke="url(#buyf-rail)" stroke-width="5"/>
    <path d="M 24 48 L 26 66 M 90 48 L 88 66" fill="none" stroke="#1a0e08" stroke-width="7"/>
    <path d="M 24 48 L 26 66 M 90 48 L 88 66" fill="none" stroke="#c49463" stroke-width="3.5"/>
    <!-- the coin -->
    <circle cx="106" cy="104" r="17" fill="url(#buyf-coin)" stroke-width="3"/>
    <circle cx="106" cy="104" r="11" fill="none" stroke="#8a5f12" stroke-width="1.8" opacity="0.7"/>
    <path d="M 96 98 A 12 12 0 0 1 104 92" fill="none" stroke="#fff3c4" stroke-width="2.2" opacity="0.9"/>
    <path d="M 102 98 L 110 98 L 106 110 Z" fill="#8a5f12" opacity="0.6" stroke="none"/>
  </g>
</svg>
