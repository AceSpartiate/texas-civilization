<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- mark-auto-off: a clockwork winding key, the sign that a person runs by themself, in the panel's dim brown: off.
       A chunky butterfly bow at the top, a thick shaft, a square socket at the foot; seen a little from above. Claude-drawn
       stand-in; replace with Astra's mark-auto (off state) (request 2026-09-16, the family panel's marks). -->
  <defs>
    <linearGradient id="autooff-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2b287"/>
      <stop offset="0.55" stop-color="#8f825b"/>
      <stop offset="1" stop-color="#5c5138"/>
    </linearGradient>
    <linearGradient id="autooff-shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2b287"/>
      <stop offset="0.45" stop-color="#8f825b"/>
      <stop offset="1" stop-color="#4f4530"/>
    </linearGradient>
    <linearGradient id="autooff-socket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5956b"/>
      <stop offset="1" stop-color="#4f4530"/>
    </linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-12 48 48)">
    <!-- the bow: two fat rounded wings either side of a hub -->
    <path d="M 44 34 C 30 36 8 34 5 20 C 3 9 16 4 28 8 C 38 11 43 22 44 34 Z" fill="url(#autooff-wing)" stroke="#1a0e08" stroke-width="3"/>
    <path d="M 52 34 C 66 36 88 34 91 20 C 93 9 80 4 68 8 C 58 11 53 22 52 34 Z" fill="url(#autooff-wing)" stroke="#1a0e08" stroke-width="3"/>
    <ellipse cx="24" cy="19" rx="8" ry="5.5" fill="#3b3427" stroke="#1a0e08" stroke-width="2"/>
    <ellipse cx="72" cy="19" rx="8" ry="5.5" fill="#3b3427" stroke="#1a0e08" stroke-width="2"/>
    <!-- the shaft -->
    <path d="M 39 30 L 57 30 L 55 64 L 41 64 Z" fill="url(#autooff-shaft)" stroke="#1a0e08" stroke-width="3"/>
    <!-- the hub where the wings meet -->
    <ellipse cx="48" cy="32" rx="14" ry="8" fill="url(#autooff-wing)" stroke="#1a0e08" stroke-width="2.8"/>
    <!-- the socket foot: a square barrel, its dark hole showing on top -->
    <path d="M 34 62 L 62 62 L 65 84 L 31 84 Z" fill="url(#autooff-socket)" stroke="#1a0e08" stroke-width="3"/>
    <path d="M 31 84 L 65 84 L 65 91 L 31 91 Z" fill="#4f4530" stroke="#1a0e08" stroke-width="3"/>
    <rect x="41" y="68" width="14" height="12" fill="#2a2418" stroke="#1a0e08" stroke-width="2"/>
    <!-- rim light, upper left -->
    <path d="M 10 13 C 15 7 22 6 30 9" fill="none" stroke="#e8dcb4" stroke-width="2.2" opacity="0.85"/>
    <path d="M 42 34 L 43 60" fill="none" stroke="#e8dcb4" stroke-width="2" opacity="0.75"/>
    <path d="M 36 66 L 35 81" fill="none" stroke="#e8dcb4" stroke-width="1.8" opacity="0.6"/>
  </g>
</svg>
