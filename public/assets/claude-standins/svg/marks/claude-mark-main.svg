<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- mark-main: a brass star badge, the student's main person. Faceted: each point lit on its upper-left face and dark on
       the lower-right, a small pin in the middle. Claude-drawn stand-in; replace with Astra's mark-main
       (request 2026-09-16, the family panel's marks). -->
  <defs>
    <linearGradient id="main-lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#e0aa38"/>
    </linearGradient>
    <linearGradient id="main-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c58a1e"/>
      <stop offset="1" stop-color="#8a5c12"/>
    </linearGradient>
    <radialGradient id="main-pin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fbe4a0"/>
      <stop offset="1" stop-color="#b47a1a"/>
    </radialGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the whole star, outlined; points at 48,8  86,36  71,82  25,82  10,36; inner at 58,32  62,58  48,68  34,58  38,32 -->
    <path d="M 48 8 L 58 32 L 86 36 L 62 58 L 71 82 L 48 68 L 25 82 L 34 58 L 10 36 L 38 32 Z" fill="url(#main-dark)" stroke="#1a0e08" stroke-width="2.8"/>
    <!-- lit facets: the left half of each point, and the top face of the centre -->
    <path d="M 48 8 L 48 46 L 38 32 Z" fill="url(#main-lit)"/>
    <path d="M 86 36 L 48 46 L 58 32 Z" fill="url(#main-lit)"/>
    <path d="M 10 36 L 48 46 L 34 58 Z" fill="url(#main-lit)"/>
    <path d="M 25 82 L 48 46 L 48 68 Z" fill="#d9a22e"/>
    <path d="M 71 82 L 48 46 L 62 58 Z" fill="#c8901f"/>
    <!-- the facet seams -->
    <path d="M 48 8 L 48 46 M 86 36 L 48 46 M 71 82 L 48 46 M 25 82 L 48 46 M 10 36 L 48 46" fill="none" stroke="#7a4d0c" stroke-width="1" opacity="0.7"/>
    <!-- rim light on the upper-left edges -->
    <path d="M 46 12 L 40 28" fill="none" stroke="#fff1c0" stroke-width="1.8" opacity="0.9"/>
    <path d="M 14 38 L 34 35" fill="none" stroke="#fff1c0" stroke-width="1.6" opacity="0.8"/>
    <!-- the pin -->
    <circle cx="48" cy="46" r="6.5" fill="url(#main-pin)" stroke="#1a0e08" stroke-width="2"/>
    <circle cx="46" cy="44" r="1.8" fill="#fff6d8"/>
  </g>
</svg>
