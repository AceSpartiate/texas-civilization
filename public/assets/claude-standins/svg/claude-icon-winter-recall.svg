      <path d="M 26 74 Q 10 82 14 104" fill="none" stroke="#1a0e08" stroke-width="11"/>
      <path d="M 26 74 Q 10 82 14 104" fill="none" stroke="#2a1a10" stroke-width="5.5"/>
      <path d="M 28 72 Q 22 92 40 96 L 86 96 Q 104 94 102 78 L 98 66 Q 86 60 66 62 L 44 62 Q 30 62 28 72 Z" fill="url(#recall-horse)" stroke-width="4"/>
      <path d="M 92 66 Q 100 44 116 34 L 124 44 Q 122 54 112 56 Q 106 60 104 76 Z" fill="url(#recall-horse)" stroke-width="4"/>
      <path d="M 114 34 L 118 24 L 121 38" fill="#8b432b" stroke-width="3"/>
      <path d="M 96 62 Q 104 46 114 36" fill="none" stroke="#2a1a10" stroke-width="6"/>
      <circle cx="117" cy="42" r="2.4" fill="#1a0e08" stroke="none"/>
      <path d="M 50 94 L 46 118 M 82 94 L 90 118" fill="none" stroke="#1a0e08" stroke-width="12"/>
      <path d="M 50 94 L 46 118 M 82 94 L 90 118" fill="none" stroke="#a5532f" stroke-width="6"/>
      <path d="M 62 76 L 58 90 L 66 98" fill="none" stroke="#1a0e08" stroke-width="12"/>
      <path d="M 62 76 L 58 90 L 66 98" fill="none" stroke="#c3a679" stroke-width="6"/>
      <path d="M 48 64 L 82 64 L 84 80 L 46 80 Z" fill="#6b4a2c" stroke-width="3.4"/>
      <path d="M 56 78 L 58 44 Q 68 36 78 44 L 80 78 Z" fill="url(#recall-coat)" stroke-width="4"/>
      <path d="M 72 52 L 92 60" fill="none" stroke="#1a0e08" stroke-width="11"/>
      <path d="M 72 52 L 92 60" fill="none" stroke="#7d6040" stroke-width="6"/>
      <circle cx="93" cy="61" r="4.5" fill="#d9a879" stroke-width="3"/>
      <circle cx="69" cy="34" r="8.5" fill="#d9a879" stroke-width="3.6"/>
      <path d="M 52 30 Q 68 18 86 28 L 84 32 Q 68 24 54 34 Z" fill="url(#recall-hat)" stroke-width="3.6"/>
      <path d="M 60 30 Q 62 16 70 16 Q 79 16 79 30 Z" fill="url(#recall-hat)" stroke-width="3.6"/>
      <path d="M 36 66 Q 50 63 60 64" fill="none" stroke="#e0a070" stroke-width="2.6" opacity="0.7"/>
