    <path d="M 66 52 L 96 22 L 126 52 Z" fill="url(#recall-roof)" stroke-width="3"/>
    <path d="M 72 52 L 120 52 L 120 84 L 72 84 Z" fill="url(#recall-logs)" stroke-width="3"/>
    <path d="M 72 60 L 120 60 M 72 68 L 120 68 M 72 76 L 120 76" fill="none" stroke="#5e3d1e" stroke-width="1.8" opacity="0.7"/>
    <path d="M 88 84 L 88 64 L 104 64 L 104 84 Z" fill="#2a1a10" stroke-width="2.6"/>
    <path d="M 70 50 L 96 26" fill="none" stroke="#b08a5c" stroke-width="2" opacity="0.7"/>
    <!-- the ground line -->
    <path d="M 4 100 Q 64 92 124 100" fill="none" stroke="#7a6a4a" stroke-width="2.4" opacity="0.6"/>
    <!-- the horse and rider, smaller, heading right for the door -->
    <g transform="translate(2 36) scale(0.68)">
      <path d="M 40 92 L 30 116 M 90 92 L 100 116" fill="none" stroke="#1a0e08" stroke-width="12"/>
