<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-winter-recall: a rider turning back toward the family's cabin. Claude-drawn stand-in; replace with Astra's
       icon-winter-recall (request 2026-09-16, the winter's icons). -->
  <defs>
    <linearGradient id="recall-horse" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2703f"/><stop offset="0.55" stop-color="#8b432b"/><stop offset="1" stop-color="#57261a"/></linearGradient>
    <linearGradient id="recall-coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7a52"/><stop offset="1" stop-color="#5e4629"/></linearGradient>
    <linearGradient id="recall-hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4b075"/><stop offset="1" stop-color="#8c683d"/></linearGradient>
    <linearGradient id="recall-logs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#7a5534"/></linearGradient>
    <linearGradient id="recall-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c6a44"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the cabin, small, at the right; chimney, roof, log wall and a dark door -->
