<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-travel-home: a cabin's open doorway, seen square on, warm light inside. Claude-drawn stand-in; replace with
       Astra's icon-travel-home (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="home-logs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#7a5534"/></linearGradient>
    <linearGradient id="home-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c6a44"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="home-door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2412"/><stop offset="1" stop-color="#f0b85a"/></linearGradient>
    <linearGradient id="home-frame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9b27a"/><stop offset="1" stop-color="#7a5534"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the log wall, courses of round logs, and the eave above -->
    <path d="M 10 40 L 118 40 L 118 122 L 10 122 Z" fill="url(#home-logs)" stroke-width="3"/>
    <path d="M 10 52 L 118 52 M 10 66 L 118 66 M 10 80 L 118 80 M 10 94 L 118 94 M 10 108 L 118 108" fill="none" stroke="#1a0e08" stroke-width="2.4" opacity="0.8"/>
    <path d="M 14 45 L 114 45 M 14 59 L 114 59 M 14 73 L 114 73 M 14 87 L 114 87 M 14 101 L 114 101 M 14 115 L 114 115" fill="none" stroke="#e0b98a" stroke-width="1.8" opacity="0.5"/>
    <path d="M 2 44 L 126 44 L 126 22 L 2 22 Z" fill="url(#home-roof)" stroke-width="3"/>
    <path d="M 6 26 L 122 26" fill="none" stroke="#b08a5c" stroke-width="2" opacity="0.7"/>
    <!-- the doorway, its frame, and the lit floor inside -->
    <path d="M 40 122 L 40 50 L 88 50 L 88 122 Z" fill="url(#home-door)" stroke-width="3"/>
    <path d="M 36 122 L 36 46 L 92 46 L 92 122 L 86 122 L 86 52 L 42 52 L 42 122 Z" fill="url(#home-frame)" stroke-width="2.6"/>
    <path d="M 44 96 Q 64 90 84 96 L 84 120 L 44 120 Z" fill="#f0c064" stroke="none" opacity="0.6"/>
    <!-- the door itself, standing open against the wall on the right -->
    <path d="M 88 50 L 110 58 L 110 122 L 88 122 Z" fill="#8c6238" stroke-width="2.8"/>
    <path d="M 92 56 L 106 61 M 92 70 L 106 74 M 92 84 L 106 88 M 92 98 L 106 102" fill="none" stroke="#4b3018" stroke-width="1.8" opacity="0.6"/>
    <circle cx="94" cy="88" r="2.4" fill="#3b3427" stroke="none"/>
  </g>
</svg>
