<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-work: a hoe leaning against a full gathering basket - the everyday work about the place. Claude-drawn stand-in;
       replace with Astra's icon-work (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="work-basket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b27a"/><stop offset="0.5" stop-color="#a5784b"/><stop offset="1" stop-color="#5e3d1e"/></linearGradient>
    <linearGradient id="work-blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0a29c"/><stop offset="0.5" stop-color="#6a6c68"/><stop offset="1" stop-color="#2f312e"/></linearGradient>
    <linearGradient id="work-handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#6a4525"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the hoe, leaning behind the basket -->
    <path d="M 100 8 L 78 96" fill="none" stroke="#1a0e08" stroke-width="11"/>
    <path d="M 100 8 L 78 96" fill="none" stroke="url(#work-handle)" stroke-width="7"/>
    <path d="M 72 92 Q 80 86 90 92 L 106 118 L 60 118 Z" fill="url(#work-blade)" stroke-width="3"/>
    <path d="M 68 114 L 98 114" fill="none" stroke="#e6e8e2" stroke-width="2.4" opacity="0.9"/>
    <!-- the basket: a woven tub with a handle, corn ears in it -->
    <path d="M 20 60 Q 46 44 72 60 L 66 118 L 26 118 Z" fill="url(#work-basket)" stroke-width="3"/>
    <path d="M 24 74 Q 46 68 68 74 M 24 88 Q 46 82 66 88 M 26 102 Q 46 96 64 102" fill="none" stroke="#5e3d1e" stroke-width="2" opacity="0.6"/>
    <path d="M 30 66 L 34 112 M 46 62 L 46 114 M 62 66 L 58 112" fill="none" stroke="#e0b98a" stroke-width="1.8" opacity="0.5"/>
    <path d="M 22 62 Q 46 52 70 62" fill="none" stroke="#1a0e08" stroke-width="5"/>
    <path d="M 22 62 Q 46 52 70 62" fill="none" stroke="#c49463" stroke-width="2.6"/>
    <path d="M 30 58 Q 46 24 62 58" fill="none" stroke="#1a0e08" stroke-width="8"/>
    <path d="M 30 58 Q 46 24 62 58" fill="none" stroke="#a5784b" stroke-width="4.5"/>
    <!-- the corn heaped in it -->
    <ellipse cx="36" cy="56" rx="8" ry="5" fill="#e8c46a" stroke-width="2.2"/>
    <ellipse cx="52" cy="54" rx="8" ry="5" fill="#e8c46a" stroke-width="2.2"/>
    <ellipse cx="44" cy="50" rx="8" ry="5" fill="#f0d47a" stroke-width="2.2"/>
  </g>
</svg>
