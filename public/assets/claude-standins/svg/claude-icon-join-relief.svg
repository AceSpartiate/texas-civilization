<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-join-relief: riders crossing open ground toward a far church front - the Alamo, small on the horizon, and two
       riders in the foreground going for it. Claude-drawn stand-in; replace with Astra's icon-join-relief
       (request 2026-09-16, the winter's icons). -->
  <defs>
    <linearGradient id="relief-horse" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2703f"/><stop offset="0.55" stop-color="#8b432b"/><stop offset="1" stop-color="#57261a"/></linearGradient>
    <linearGradient id="relief-horse2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8c86"/><stop offset="0.55" stop-color="#5a5c58"/><stop offset="1" stop-color="#2f312e"/></linearGradient>
    <linearGradient id="relief-coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7a52"/><stop offset="1" stop-color="#5e4629"/></linearGradient>
    <linearGradient id="relief-hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4b075"/><stop offset="1" stop-color="#8c683d"/></linearGradient>
    <linearGradient id="relief-stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6d9b8"/><stop offset="1" stop-color="#9a8560"/></linearGradient>
    <linearGradient id="relief-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a86e"/><stop offset="1" stop-color="#8c7a48"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the open ground, a low rise -->
    <path d="M 2 66 Q 64 50 126 66 L 126 124 L 2 124 Z" fill="url(#relief-ground)" stroke-width="3"/>
    <!-- the church front, far off on the rise -->
    <path d="M 82 60 L 82 38 L 88 38 L 88 33 L 93 33 L 93 28 Q 100 20 107 28 L 107 33 L 112 33 L 112 38 L 118 38 L 118 60 Z" fill="url(#relief-stone)" stroke-width="2.6"/>
    <path d="M 96 60 L 96 48 Q 100 43 104 48 L 104 60 Z" fill="#3a2a18" stroke-width="2"/>
    <path d="M 84 40 L 84 58" fill="none" stroke="#fbf1d8" stroke-width="1.6" opacity="0.8"/>
    <!-- the far rider, grey horse, smaller -->
    <g transform="translate(40 44) scale(0.42)">
      <path d="M 40 92 L 30 116 M 90 92 L 100 116" fill="none" stroke="#1a0e08" stroke-width="14"/>
      <path d="M 40 92 L 30 116 M 90 92 L 100 116" fill="none" stroke="#2f312e" stroke-width="7"/>
      <path d="M 26 74 Q 10 82 14 104" fill="none" stroke="#1a0e08" stroke-width="13"/>
      <path d="M 26 74 Q 10 82 14 104" fill="none" stroke="#2a2a28" stroke-width="6"/>
      <path d="M 28 72 Q 22 92 40 96 L 86 96 Q 104 94 102 78 L 98 66 Q 86 60 66 62 L 44 62 Q 30 62 28 72 Z" fill="url(#relief-horse2)" stroke-width="5"/>
      <path d="M 92 66 Q 100 44 116 34 L 124 44 Q 122 54 112 56 Q 106 60 104 76 Z" fill="url(#relief-horse2)" stroke-width="5"/>
      <path d="M 50 94 L 46 118 M 82 94 L 90 118" fill="none" stroke="#1a0e08" stroke-width="14"/>
      <path d="M 50 94 L 46 118 M 82 94 L 90 118" fill="none" stroke="#6a6c68" stroke-width="7"/>
      <path d="M 56 78 L 58 44 Q 68 36 78 44 L 80 78 Z" fill="#6b5a3e" stroke-width="5"/>
      <circle cx="69" cy="34" r="8.5" fill="#d9a879" stroke-width="4.5"/>
      <path d="M 52 30 Q 68 18 86 28 L 84 32 Q 68 24 54 34 Z" fill="#c4a06a" stroke-width="4.5"/>
      <path d="M 60 30 Q 62 16 70 16 Q 79 16 79 30 Z" fill="#c4a06a" stroke-width="4.5"/>
    </g>
    <!-- the near rider, chestnut -->
    <g transform="translate(-4 52) scale(0.6)">
      <path d="M 40 92 L 30 116 M 90 92 L 100 116" fill="none" stroke="#1a0e08" stroke-width="12"/>
      <path d="M 40 92 L 30 116 M 90 92 L 100 116" fill="none" stroke="#57261a" stroke-width="6"/>
      <path d="M 26 74 Q 10 82 14 104" fill="none" stroke="#1a0e08" stroke-width="11"/>
      <path d="M 26 74 Q 10 82 14 104" fill="none" stroke="#2a1a10" stroke-width="5.5"/>
      <path d="M 28 72 Q 22 92 40 96 L 86 96 Q 104 94 102 78 L 98 66 Q 86 60 66 62 L 44 62 Q 30 62 28 72 Z" fill="url(#relief-horse)" stroke-width="4.5"/>
      <path d="M 92 66 Q 100 44 116 34 L 124 44 Q 122 54 112 56 Q 106 60 104 76 Z" fill="url(#relief-horse)" stroke-width="4.5"/>
      <path d="M 114 34 L 118 24 L 121 38" fill="#8b432b" stroke-width="3.4"/>
      <path d="M 96 62 Q 104 46 114 36" fill="none" stroke="#2a1a10" stroke-width="6"/>
      <circle cx="117" cy="42" r="2.6" fill="#1a0e08" stroke="none"/>
      <path d="M 50 94 L 46 118 M 82 94 L 90 118" fill="none" stroke="#1a0e08" stroke-width="12"/>
      <path d="M 50 94 L 46 118 M 82 94 L 90 118" fill="none" stroke="#a5532f" stroke-width="6"/>
      <path d="M 62 76 L 58 90 L 66 98" fill="none" stroke="#1a0e08" stroke-width="12"/>
      <path d="M 62 76 L 58 90 L 66 98" fill="none" stroke="#c3a679" stroke-width="6"/>
      <path d="M 48 64 L 82 64 L 84 80 L 46 80 Z" fill="#6b4a2c" stroke-width="3.6"/>
      <path d="M 56 78 L 58 44 Q 68 36 78 44 L 80 78 Z" fill="url(#relief-coat)" stroke-width="4.5"/>
      <path d="M 72 52 L 92 60" fill="none" stroke="#1a0e08" stroke-width="11"/>
      <path d="M 72 52 L 92 60" fill="none" stroke="#7d6040" stroke-width="6"/>
      <circle cx="93" cy="61" r="4.5" fill="#d9a879" stroke-width="3.4"/>
      <circle cx="69" cy="34" r="8.5" fill="#d9a879" stroke-width="4"/>
      <path d="M 52 30 Q 68 18 86 28 L 84 32 Q 68 24 54 34 Z" fill="url(#relief-hat)" stroke-width="4"/>
      <path d="M 60 30 Q 62 16 70 16 Q 79 16 79 30 Z" fill="url(#relief-hat)" stroke-width="4"/>
      <path d="M 36 66 Q 50 63 60 64" fill="none" stroke="#e0a070" stroke-width="2.6" opacity="0.7"/>
    </g>
  </g>
</svg>
