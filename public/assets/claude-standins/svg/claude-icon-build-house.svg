<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-build-house: a log being notched - a saddle notch cut into the end of a round log, the axe that cut it beside.
       Claude-drawn stand-in; replace with Astra's icon-build-house (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="build-log" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c49463"/><stop offset="0.5" stop-color="#8c6238"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <radialGradient id="build-end" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#e8c898"/><stop offset="1" stop-color="#b8875a"/></radialGradient>
    <linearGradient id="build-head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0a29c"/><stop offset="0.5" stop-color="#6a6c68"/><stop offset="1" stop-color="#2f312e"/></linearGradient>
    <linearGradient id="build-handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#6a4525"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- a lower log already laid, running back -->
    <path d="M 4 100 L 124 100 L 124 122 L 4 122 Z" fill="url(#build-log)" stroke-width="3"/>
    <path d="M 8 106 L 120 106" fill="none" stroke="#e8c898" stroke-width="2" opacity="0.6"/>
    <!-- the log being notched, lying across, its near end toward us with the notch cut in its underside -->
    <path d="M 20 56 L 112 56 Q 124 66 112 78 L 92 78 Q 88 90 76 90 Q 64 90 60 78 L 20 78 Z" fill="url(#build-log)" stroke-width="3"/>
    <ellipse cx="20" cy="67" rx="10" ry="11" fill="url(#build-end)" stroke-width="3"/>
    <ellipse cx="20" cy="67" rx="5" ry="6" fill="none" stroke="#a5784b" stroke-width="1.4" opacity="0.7"/>
    <path d="M 32 60 L 106 60" fill="none" stroke="#e8c898" stroke-width="2" opacity="0.7"/>
    <path d="M 34 74 L 58 74" fill="none" stroke="#4b3018" stroke-width="1.8" opacity="0.6"/>
    <!-- the notch's fresh-cut face -->
    <path d="M 60 78 Q 64 88 76 88 Q 88 88 92 78 Q 76 84 60 78 Z" fill="#e8c898" stroke-width="2.2"/>
    <!-- the axe, standing head-down against the log -->
    <path d="M 100 44 L 62 10" fill="none" stroke="#1a0e08" stroke-width="10"/>
    <path d="M 100 44 L 62 10" fill="none" stroke="url(#build-handle)" stroke-width="6"/>
    <g transform="rotate(42 100 44)">
      <path d="M 92 34 L 110 34 Q 122 40 122 56 Q 112 52 108 56 L 92 56 Z" fill="url(#build-head)" stroke-width="3"/>
      <path d="M 118 42 Q 120 48 120 54" fill="none" stroke="#e6e8e2" stroke-width="2.2" opacity="0.9"/>
    </g>
    <!-- chips -->
    <path d="M 44 92 L 52 88 M 104 92 L 112 96" fill="none" stroke="#d9b27a" stroke-width="4"/>
  </g>
</svg>
