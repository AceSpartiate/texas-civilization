<defs>
  <!-- Shared by every Claude-drawn stand-in (scripts/build-claude-standins.mjs inlines this once per sheet).
       grain: a fine paper speckle over the fills, the texture Astra's painted sheets have; it never touches alpha. -->
  <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="11" result="grain-n"/>
    <feColorMatrix in="grain-n" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.08  0 0 0 0 0.02  0 0 0 0.5 -0.21" result="grain-specks"/>
    <feComposite in="grain-specks" in2="SourceGraphic" operator="in" result="grain-clipped"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain-clipped"/></feMerge>
  </filter>
</defs>
