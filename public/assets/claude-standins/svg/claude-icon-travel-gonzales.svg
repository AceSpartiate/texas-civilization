<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-travel-gonzales: a signpost at a fork, its board pointing toward the town's roofs on the horizon. Claude-drawn
       stand-in; replace with Astra's icon-travel-gonzales (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="gonz-post" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49463"/><stop offset="0.5" stop-color="#9a7048"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="gonz-board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0c290"/><stop offset="1" stop-color="#a5784b"/></linearGradient>
    <linearGradient id="gonz-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c6a44"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="gonz-road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ad7a"/><stop offset="1" stop-color="#9c7f52"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the road running off to the town -->
    <path d="M 22 124 Q 60 96 106 66" fill="none" stroke="#1a0e08" stroke-width="16"/>
    <path d="M 22 124 Q 60 96 106 66" fill="none" stroke="url(#gonz-road)" stroke-width="11"/>
    <!-- the town: three small roofs on the horizon at the right -->
    <path d="M 82 60 L 94 46 L 106 60 Z M 100 58 L 112 42 L 124 58 Z" fill="url(#gonz-roof)" stroke-width="2.6"/>
    <path d="M 84 60 L 104 60 L 104 68 L 84 68 Z M 102 58 L 122 58 L 122 66 L 102 66 Z" fill="#c49463" stroke-width="2.6"/>
    <path d="M 92 68 L 92 62 L 98 62 L 98 68 Z" fill="#2a1a10" stroke-width="1.8"/>
    <!-- the post -->
    <path d="M 40 12 L 52 12 L 52 118 L 40 118 Z" fill="url(#gonz-post)" stroke-width="3"/>
    <path d="M 43 18 L 43 112" fill="none" stroke="#e0b98a" stroke-width="2" opacity="0.7"/>
    <!-- the board, an arrow shape pointing right toward the town -->
    <path d="M 30 30 L 92 30 L 106 42 L 92 54 L 30 54 Z" fill="url(#gonz-board)" stroke-width="3"/>
    <path d="M 34 34 L 90 34" fill="none" stroke="#f0d8b0" stroke-width="2" opacity="0.8"/>
    <path d="M 44 42 L 84 42" fill="none" stroke="#5e3d1e" stroke-width="3" opacity="0.6"/>
    <circle cx="46" cy="42" r="2.4" fill="#3b3427" stroke="none"/>
    <!-- a tuft of grass at the foot -->
    <path d="M 34 118 L 30 108 M 58 118 L 62 108 M 56 118 L 56 110" fill="none" stroke="#5f7a34" stroke-width="3"/>
  </g>
</svg>
