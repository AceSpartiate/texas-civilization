<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-fetch-seed: a seed sack, tied at the neck, open enough to show the seed. Claude-drawn stand-in; replace with
       Astra's icon-fetch-seed (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="seed-sack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2d2aa"/><stop offset="0.55" stop-color="#bfa878"/><stop offset="1" stop-color="#7e6a48"/></linearGradient>
    <radialGradient id="seed-heap" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#f0d47a"/><stop offset="1" stop-color="#b08a2a"/></radialGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the sack body, slumped and full -->
    <path d="M 26 118 Q 12 96 20 66 Q 26 44 48 38 L 80 38 Q 102 44 108 66 Q 116 96 102 118 Z" fill="url(#seed-sack)" stroke-width="3"/>
    <!-- the gathered neck and the tie -->
    <path d="M 48 38 Q 52 22 64 20 Q 76 22 80 38 Q 64 44 48 38 Z" fill="url(#seed-sack)" stroke-width="3"/>
    <path d="M 46 40 Q 64 48 82 40 L 84 46 Q 64 54 44 46 Z" fill="#8b432b" stroke-width="2.6"/>
    <path d="M 82 42 Q 96 40 100 52 Q 92 50 88 56" fill="#8b432b" stroke-width="2.4"/>
    <!-- the open mouth showing seed -->
    <path d="M 54 22 Q 64 14 74 22 Q 64 28 54 22 Z" fill="url(#seed-heap)" stroke-width="2.4"/>
    <!-- the sacking's weave and folds -->
    <path d="M 30 70 Q 44 76 60 72 M 34 92 Q 50 98 70 94" fill="none" stroke="#7e6a48" stroke-width="1.8" opacity="0.55"/>
    <path d="M 26 66 Q 22 90 30 112" fill="none" stroke="#f3e6c6" stroke-width="2.4" opacity="0.8"/>
    <!-- seed spilled at the foot -->
    <ellipse cx="112" cy="116" rx="4" ry="3" fill="#e8c46a" stroke-width="2"/>
    <ellipse cx="102" cy="122" rx="4" ry="3" fill="#e8c46a" stroke-width="2"/>
    <ellipse cx="118" cy="106" rx="4" ry="3" fill="#e8c46a" stroke-width="2"/>
    <ellipse cx="16" cy="120" rx="4" ry="3" fill="#e8c46a" stroke-width="2"/>
  </g>
</svg>
