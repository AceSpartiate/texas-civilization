<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-join-garrison: the Alamo church's front - the curved parapet, four columns, the arched door and two niches - in
       pale limestone. Claude-drawn stand-in; replace with Astra's icon-join-garrison (request 2026-09-16, the winter's icons). -->
  <defs>
    <linearGradient id="garr-stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6d9b8"/><stop offset="0.6" stop-color="#cbb68c"/><stop offset="1" stop-color="#9a8560"/></linearGradient>
    <linearGradient id="garr-wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8c9a2"/><stop offset="1" stop-color="#9a8560"/></linearGradient>
    <linearGradient id="garr-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a18"/><stop offset="1" stop-color="#1c1208"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the low wings either side -->
    <path d="M 4 74 L 30 74 L 30 116 L 4 116 Z" fill="url(#garr-wing)" stroke-width="3"/>
    <path d="M 98 74 L 124 74 L 124 116 L 98 116 Z" fill="url(#garr-wing)" stroke-width="3"/>
    <!-- the facade with its humped parapet -->
    <path d="M 26 116 L 26 44 L 40 44 L 40 34 L 50 34 L 50 24 Q 64 8 78 24 L 78 34 L 88 34 L 88 44 L 102 44 L 102 116 Z" fill="url(#garr-stone)" stroke-width="3"/>
    <!-- the cornice line between the storeys -->
    <path d="M 28 70 L 100 70" fill="none" stroke="#7a6444" stroke-width="2.2" opacity="0.8"/>
    <!-- the arched door -->
    <path d="M 52 116 L 52 84 Q 64 70 76 84 L 76 116 Z" fill="url(#garr-dark)" stroke-width="3"/>
    <!-- the two niches, lower and upper -->
    <path d="M 36 96 L 36 82 Q 42 76 48 82 L 48 96 Z" fill="#5f4a2c" stroke-width="2.4"/>
    <path d="M 80 96 L 80 82 Q 86 76 92 82 L 92 96 Z" fill="#5f4a2c" stroke-width="2.4"/>
    <path d="M 58 60 L 58 48 Q 64 42 70 48 L 70 60 Z" fill="#5f4a2c" stroke-width="2.4"/>
    <!-- the paired columns flanking the door -->
    <path d="M 32 74 L 32 112 M 44 74 L 44 112 M 84 74 L 84 112 M 96 74 L 96 112" fill="none" stroke="#7a6444" stroke-width="3" opacity="0.7"/>
    <!-- the top window -->
    <rect x="60" y="28" width="8" height="10" rx="1.5" fill="#5f4a2c" stroke-width="2.2"/>
    <!-- lit edges, upper left -->
    <path d="M 29 48 L 29 100" fill="none" stroke="#fbf1d8" stroke-width="2" opacity="0.8"/>
    <path d="M 52 26 Q 62 14 72 20" fill="none" stroke="#fbf1d8" stroke-width="2" opacity="0.8"/>
  </g>
</svg>
