<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-replace-hoe: a new hoe, bright-bladed, standing upright, with a coin at its foot. Claude-drawn stand-in;
       replace with Astra's icon-replace-hoe (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="newhoe-blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c6c8c2"/><stop offset="0.5" stop-color="#7a7c78"/><stop offset="1" stop-color="#3a3c38"/></linearGradient>
    <linearGradient id="newhoe-handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0b98a"/><stop offset="0.5" stop-color="#c49463"/><stop offset="1" stop-color="#7a5534"/></linearGradient>
    <radialGradient id="newhoe-coin" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#f6dc80"/><stop offset="0.6" stop-color="#d4a83a"/><stop offset="1" stop-color="#8a5f12"/></radialGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the handle, straight and new, leaning a little -->
    <path d="M 78 8 L 58 100" fill="none" stroke="#1a0e08" stroke-width="12"/>
    <path d="M 78 8 L 58 100" fill="none" stroke="url(#newhoe-handle)" stroke-width="8"/>
    <path d="M 74 14 L 58 92" fill="none" stroke="#f0d8b0" stroke-width="2" opacity="0.8"/>
    <!-- the blade, hung from the handle's foot, edge down -->
    <path d="M 52 96 Q 60 90 70 96 L 92 120 L 26 120 Z" fill="url(#newhoe-blade)" stroke-width="3"/>
    <path d="M 34 116 L 84 116" fill="none" stroke="#e6e8e2" stroke-width="2.6" opacity="0.9"/>
    <path d="M 48 100 L 38 114" fill="none" stroke="#e6e8e2" stroke-width="1.8" opacity="0.7"/>
    <!-- the coin, leaning at the foot -->
    <circle cx="104" cy="104" r="17" fill="url(#newhoe-coin)" stroke-width="3"/>
    <circle cx="104" cy="104" r="11" fill="none" stroke="#8a5f12" stroke-width="1.8" opacity="0.7"/>
    <path d="M 94 98 A 12 12 0 0 1 102 92" fill="none" stroke="#fff3c4" stroke-width="2.2" opacity="0.9"/>
    <path d="M 100 98 L 108 98 L 104 110 Z" fill="#8a5f12" opacity="0.6" stroke="none"/>
  </g>
</svg>
