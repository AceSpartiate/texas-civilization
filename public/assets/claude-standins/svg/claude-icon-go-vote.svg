<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-go-vote: a hand putting a folded paper into the slot of a wooden ballot box. Claude-drawn stand-in; replace with
       Astra's icon-go-vote (request 2026-09-16, the winter's icons). -->
  <defs>
    <linearGradient id="vote-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#8c6238"/></linearGradient>
    <linearGradient id="vote-front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5784b"/><stop offset="1" stop-color="#5e3d1e"/></linearGradient>
    <linearGradient id="vote-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5534"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="vote-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1d8"/><stop offset="1" stop-color="#d9c39a"/></linearGradient>
    <linearGradient id="vote-sleeve" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9512d"/><stop offset="1" stop-color="#6e2f18"/></linearGradient>
    <linearGradient id="vote-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6b98c"/><stop offset="1" stop-color="#b8845a"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the box, seen a little from above and the left -->
    <path d="M 22 70 L 96 70 L 96 118 L 22 118 Z" fill="url(#vote-front)" stroke-width="3"/>
    <path d="M 96 70 L 116 58 L 116 106 L 96 118 Z" fill="url(#vote-side)" stroke-width="3"/>
    <path d="M 22 70 L 42 58 L 116 58 L 96 70 Z" fill="url(#vote-top)" stroke-width="3"/>
    <!-- the slot -->
    <path d="M 46 65 L 92 65 L 96 62 L 50 62 Z" fill="#1a0e08" stroke-width="2.4"/>
    <!-- plank seams and a lit top edge -->
    <path d="M 22 94 L 96 94" fill="none" stroke="#4b3018" stroke-width="1.8" opacity="0.7"/>
    <path d="M 26 73 L 92 73" fill="none" stroke="#e0b98a" stroke-width="1.8" opacity="0.6"/>
    <!-- a strap and hasp on the front -->
    <path d="M 52 96 L 66 96 L 66 108 L 52 108 Z" fill="#5a5c58" stroke-width="2.4"/>
    <circle cx="59" cy="102" r="2.2" fill="#1a0e08" stroke="none"/>
    <!-- the folded paper, half in the slot -->
    <path d="M 60 30 L 84 22 L 90 60 L 66 64 Z" fill="url(#vote-paper)" stroke-width="2.8"/>
    <path d="M 62 34 L 82 28" fill="none" stroke="#6b5a3e" stroke-width="1.8" opacity="0.7"/>
    <path d="M 66 46 L 86 42" fill="none" stroke="#6b5a3e" stroke-width="1.6" opacity="0.5"/>
    <!-- the hand, coming down from the upper left to hold the paper -->
    <path d="M 10 8 L 40 8 L 52 30 L 22 34 Z" fill="url(#vote-sleeve)" stroke-width="3"/>
    <path d="M 28 30 Q 44 22 62 30 Q 70 36 62 42 L 50 46 Q 40 48 34 42 Z" fill="url(#vote-skin)" stroke-width="2.8"/>
    <path d="M 58 32 Q 68 30 70 36 Q 66 40 58 40" fill="url(#vote-skin)" stroke-width="2.4"/>
    <path d="M 48 40 Q 52 44 52 48" fill="none" stroke="#9a6a44" stroke-width="1.6" opacity="0.7"/>
    <path d="M 36 32 Q 44 27 54 29" fill="none" stroke="#f6d9b8" stroke-width="1.8" opacity="0.8"/>
  </g>
</svg>
