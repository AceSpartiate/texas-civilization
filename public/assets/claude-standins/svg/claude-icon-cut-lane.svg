<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-cut-lane: an axe swung into brush beside a track. Claude-drawn stand-in; replace with Astra's icon-cut-lane
       (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="lane-track" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ad7a"/><stop offset="1" stop-color="#9c7f52"/></linearGradient>
    <radialGradient id="lane-bush" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#8faa52"/><stop offset="0.6" stop-color="#5f7a34"/><stop offset="1" stop-color="#34471c"/></radialGradient>
    <linearGradient id="lane-head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0a29c"/><stop offset="0.5" stop-color="#6a6c68"/><stop offset="1" stop-color="#2f312e"/></linearGradient>
    <linearGradient id="lane-handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#6a4525"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the track, running up the picture on the right -->
    <path d="M 100 124 Q 110 90 100 60 Q 92 40 108 10" fill="none" stroke="#1a0e08" stroke-width="13"/>
    <path d="M 100 124 Q 110 90 100 60 Q 92 40 108 10" fill="none" stroke="url(#lane-track)" stroke-width="8.5"/>
    <!-- the brush: two bushy clumps with stems -->
    <path d="M 30 116 L 34 96 M 44 118 L 40 100 M 20 114 L 24 100" fill="none" stroke="#5e3d1e" stroke-width="4"/>
    <ellipse cx="34" cy="86" rx="30" ry="22" fill="url(#lane-bush)" stroke-width="3"/>
    <ellipse cx="60" cy="98" rx="20" ry="15" fill="url(#lane-bush)" stroke-width="3"/>
    <path d="M 14 76 Q 22 66 34 66" fill="none" stroke="#b6cf7a" stroke-width="2.2" opacity="0.8"/>
    <path d="M 46 88 Q 52 86 58 88" fill="none" stroke="#b6cf7a" stroke-width="2" opacity="0.7"/>
    <!-- the axe, swung down into the brush from the upper right -->
    <g transform="rotate(48 64 60)">
      <path d="M 64 118 L 64 44" fill="none" stroke="#1a0e08" stroke-width="10"/>
      <path d="M 64 118 L 64 44" fill="none" stroke="url(#lane-handle)" stroke-width="6"/>
      <path d="M 56 30 L 74 30 Q 90 36 92 56 Q 80 50 74 54 L 56 54 Z" fill="url(#lane-head)" stroke-width="3"/>
      <path d="M 86 40 Q 90 48 90 54" fill="none" stroke="#e6e8e2" stroke-width="2.4" opacity="0.9"/>
      <path d="M 58 34 L 70 34" fill="none" stroke="#c6c8c2" stroke-width="2" opacity="0.7"/>
    </g>
    <!-- cut stems flying -->
    <path d="M 74 70 L 84 62 M 80 78 L 92 74" fill="none" stroke="#5e3d1e" stroke-width="3.5"/>
  </g>
</svg>
