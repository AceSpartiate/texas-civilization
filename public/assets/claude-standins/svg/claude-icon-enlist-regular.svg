<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-enlist-regular: a recruiting table with the muster roll unrolled and a quill in its ink pot. Claude-drawn
       stand-in; replace with Astra's icon-enlist-regular (request 2026-09-16, the winter's icons). -->
  <defs>
    <linearGradient id="enreg-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#8c6238"/></linearGradient>
    <linearGradient id="enreg-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5534"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="enreg-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1d8"/><stop offset="1" stop-color="#dcc79c"/></linearGradient>
    <linearGradient id="enreg-ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f57"/><stop offset="1" stop-color="#1e2126"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the table: legs, front apron and top seen a little from above -->
    <path d="M 20 88 L 20 118 L 30 118 L 30 90 Z" fill="url(#enreg-front)" stroke-width="3"/>
    <path d="M 98 88 L 98 118 L 108 118 L 108 90 Z" fill="url(#enreg-front)" stroke-width="3"/>
    <path d="M 14 78 L 114 78 L 114 92 L 14 92 Z" fill="url(#enreg-front)" stroke-width="3"/>
    <path d="M 22 58 L 106 58 L 118 80 L 10 80 Z" fill="url(#enreg-top)" stroke-width="3"/>
    <path d="M 26 62 L 100 62" fill="none" stroke="#e0b98a" stroke-width="2" opacity="0.7"/>
    <path d="M 18 73 L 110 73" fill="none" stroke="#6a4525" stroke-width="1.4" opacity="0.6"/>
    <!-- the roll, unrolled across the table with a curl at each end -->
    <path d="M 36 44 L 90 44 L 92 76 L 34 76 Z" fill="url(#enreg-paper)" stroke-width="2.8"/>
    <path d="M 34 76 Q 32 84 40 82 Q 46 80 44 74" fill="#e6d3a8" stroke-width="2.4"/>
    <path d="M 92 44 Q 96 36 88 36 Q 82 37 84 44" fill="#e6d3a8" stroke-width="2.4"/>
    <!-- the roll's lines of names, a mark each -->
    <path d="M 44 52 L 66 52 M 44 58 L 70 58 M 44 64 L 62 64 M 44 70 L 68 70" fill="none" stroke="#6b5a3e" stroke-width="2.2" opacity="0.8"/>
    <!-- the ink pot and quill -->
    <path d="M 92 60 L 112 60 L 110 78 L 94 78 Z" fill="url(#enreg-ink)" stroke-width="2.8"/>
    <ellipse cx="102" cy="60" rx="10" ry="3.5" fill="#6b7078" stroke-width="2.4"/>
    <path d="M 100 66 L 94 22" fill="none" stroke="#1a0e08" stroke-width="7"/>
    <path d="M 100 66 L 94 22" fill="none" stroke="#e9dcb8" stroke-width="3.6"/>
    <path d="M 95 20 C 84 22 82 34 86 44 C 92 40 94 30 95 20 Z" fill="#f2e6c8" stroke-width="2.6"/>
    <path d="M 95 20 C 104 24 106 36 100 46 C 96 40 95 30 95 20 Z" fill="#d9c9a4" stroke-width="2.6"/>
    <path d="M 95 22 L 98 44" fill="none" stroke="#9c8a62" stroke-width="1.6"/>
  </g>
</svg>
