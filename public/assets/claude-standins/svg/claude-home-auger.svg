    <linearGradient id="haug-handle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b27a"/><stop offset="0.5" stop-color="#a5784b"/><stop offset="1" stop-color="#5e3d1e"/></linearGradient>
    <linearGradient id="haug-shank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a0a29c"/><stop offset="0.5" stop-color="#6a6c68"/><stop offset="1" stop-color="#2f312e"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the shank and the twisted bit -->
    <path d="M 80 28 L 80 150" fill="none" stroke="#1a0e08" stroke-width="13"/>
    <path d="M 80 28 L 80 150" fill="none" stroke="url(#haug-shank)" stroke-width="9"/>
    <path d="M 70 80 Q 90 86 70 94 Q 90 100 70 108 Q 90 114 70 122 Q 90 128 70 136 Q 86 142 80 152" fill="none" stroke="#1a0e08" stroke-width="10"/>
