    <path d="M 74 84 Q 80 86 76 90 M 74 98 Q 80 100 76 104 M 74 112 Q 80 114 76 118 M 74 126 Q 80 128 76 132" fill="none" stroke="#d0d2cc" stroke-width="1.8" opacity="0.8"/>
    <path d="M 78 34 L 78 74" fill="none" stroke="#d0d2cc" stroke-width="2" opacity="0.7"/>
    <!-- the T handle, a round wooden bar through the eye -->
    <path d="M 14 26 L 146 26" fill="none" stroke="#1a0e08" stroke-width="20"/>
    <path d="M 14 26 L 146 26" fill="none" stroke="url(#haug-handle)" stroke-width="15"/>
    <ellipse cx="14" cy="26" rx="4.5" ry="8" fill="#e8c898" stroke-width="2.4"/>
    <ellipse cx="146" cy="26" rx="4.5" ry="8" fill="#e8c898" stroke-width="2.4"/>
    <path d="M 22 21 L 138 21" fill="none" stroke="#f0d8b0" stroke-width="2.4" opacity="0.8"/>
