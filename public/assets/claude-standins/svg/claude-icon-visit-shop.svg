<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-visit-shop: a shop front - a plank door under an eave with a picture sign (an anvil) hung out on a bracket.
       Claude-drawn stand-in; replace with Astra's icon-visit-shop (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="shop-wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9bda0"/><stop offset="1" stop-color="#8c7a58"/></linearGradient>
    <linearGradient id="shop-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c6a44"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="shop-door" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a5784b"/><stop offset="1" stop-color="#5e3d1e"/></linearGradient>
    <linearGradient id="shop-sign" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0c290"/><stop offset="1" stop-color="#a5784b"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the wall, plank siding, with a window and the door -->
    <path d="M 10 40 L 118 40 L 118 122 L 10 122 Z" fill="url(#shop-wall)" stroke-width="3"/>
    <path d="M 10 54 L 118 54 M 10 68 L 118 68 M 10 82 L 118 82 M 10 96 L 118 96 M 10 110 L 118 110" fill="none" stroke="#6a5a3c" stroke-width="1.6" opacity="0.6"/>
    <path d="M 2 42 L 126 42 L 126 22 L 2 22 Z" fill="url(#shop-roof)" stroke-width="3"/>
    <path d="M 6 26 L 122 26" fill="none" stroke="#b08a5c" stroke-width="2" opacity="0.7"/>
    <path d="M 70 122 L 70 62 L 104 62 L 104 122 Z" fill="url(#shop-door)" stroke-width="3"/>
    <path d="M 78 64 L 78 120 M 88 64 L 88 120 M 96 64 L 96 120" fill="none" stroke="#4b3018" stroke-width="1.6" opacity="0.6"/>
    <circle cx="98" cy="94" r="2.6" fill="#3b3427" stroke="none"/>
    <path d="M 20 62 L 50 62 L 50 88 L 20 88 Z" fill="#5f6f7a" stroke-width="2.8"/>
    <path d="M 35 62 L 35 88 M 20 75 L 50 75" fill="none" stroke="#1a0e08" stroke-width="2.4"/>
    <path d="M 23 65 L 32 65 M 23 78 L 32 78" fill="none" stroke="#b8c8d0" stroke-width="2" opacity="0.7"/>
    <!-- the bracket and the hanging sign with its anvil -->
    <path d="M 10 46 L 10 30 L 58 30" fill="none" stroke="#1a0e08" stroke-width="8"/>
    <path d="M 10 46 L 10 30 L 58 30" fill="none" stroke="#3b3427" stroke-width="4.5"/>
    <path d="M 30 30 L 30 40 M 54 30 L 54 40" fill="none" stroke="#3b3427" stroke-width="3"/>
    <path d="M 20 40 L 64 40 L 64 66 L 20 66 Z" fill="url(#shop-sign)" stroke-width="2.8"/>
    <path d="M 26 50 L 58 50 L 56 56 L 46 56 L 46 60 L 38 60 L 38 56 L 30 56 Z" fill="#3b3427" stroke-width="1.8"/>
    <path d="M 24 44 L 60 44" fill="none" stroke="#f0d8b0" stroke-width="1.8" opacity="0.8"/>
  </g>
</svg>
