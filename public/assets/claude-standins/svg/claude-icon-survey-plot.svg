<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-survey-plot: a stake being driven - a maul coming down on a blazed stake with a cloth tied to it. Claude-drawn
       stand-in; replace with Astra's icon-survey-plot (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="surv-stake" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9b27a"/><stop offset="0.5" stop-color="#a5784b"/><stop offset="1" stop-color="#5e3d1e"/></linearGradient>
    <linearGradient id="surv-maul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7048"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="surv-handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#6a4525"/></linearGradient>
    <linearGradient id="surv-cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1d8"/><stop offset="1" stop-color="#c9b48a"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the ground and a little grass -->
    <ellipse cx="60" cy="112" rx="34" ry="8" fill="#7a6a4a" stroke-width="2.6"/>
    <path d="M 34 106 L 30 96 M 40 108 L 38 98 M 84 106 L 90 96" fill="none" stroke="#5f7a34" stroke-width="3"/>
    <!-- the stake, pointed and driven partway -->
    <path d="M 50 30 L 70 30 L 68 100 L 60 112 L 52 100 Z" fill="url(#surv-stake)" stroke-width="3"/>
    <path d="M 52 30 L 68 30 L 66 40 L 54 40 Z" fill="#e8c898" stroke-width="2.4"/>
    <path d="M 54 44 L 55 96" fill="none" stroke="#e8c898" stroke-width="1.8" opacity="0.7"/>
    <!-- the blaze cut in the stake -->
    <path d="M 56 58 L 66 56 L 66 74 L 56 76 Z" fill="#f0d8a8" stroke-width="2.2"/>
    <!-- the cloth tied round it -->
    <path d="M 48 44 L 72 44 L 72 52 L 48 52 Z" fill="url(#surv-cloth)" stroke-width="2.4"/>
    <path d="M 70 46 Q 92 40 98 58 Q 90 54 84 62 Q 82 52 70 52 Z" fill="url(#surv-cloth)" stroke-width="2.4"/>
    <!-- the maul above, mid-swing from the upper left -->
    <g transform="rotate(-38 40 34)">
      <path d="M 8 36 L 60 36" fill="none" stroke="#1a0e08" stroke-width="10"/>
      <path d="M 8 36 L 60 36" fill="none" stroke="url(#surv-handle)" stroke-width="6"/>
      <path d="M 56 20 L 80 20 L 82 52 L 54 52 Z" fill="url(#surv-maul)" stroke-width="3"/>
      <path d="M 58 24 L 76 24" fill="none" stroke="#c49463" stroke-width="2" opacity="0.7"/>
      <path d="M 60 44 L 78 44" fill="none" stroke="#2a1a10" stroke-width="2" opacity="0.6"/>
    </g>
  </g>
</svg>
