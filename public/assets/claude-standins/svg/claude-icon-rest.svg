<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-rest: a bedroll, unrolled at one end with the pillow-fold turned back. Claude-drawn stand-in; replace with
       Astra's icon-rest (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="rest-wool" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9bb96"/><stop offset="0.55" stop-color="#9c8e6a"/><stop offset="1" stop-color="#5e5540"/></linearGradient>
    <linearGradient id="rest-inner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecdfbd"/><stop offset="1" stop-color="#b9a578"/></linearGradient>
    <linearGradient id="rest-strap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b432b"/><stop offset="1" stop-color="#4b2010"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the blanket laid out, seen a little from above -->
    <path d="M 8 84 L 96 62 L 120 78 L 32 104 Z" fill="url(#rest-inner)" stroke-width="3"/>
    <path d="M 14 88 L 92 68" fill="none" stroke="#fbf1d8" stroke-width="2" opacity="0.8"/>
    <path d="M 24 98 L 100 78" fill="none" stroke="#8c7a52" stroke-width="1.6" opacity="0.5"/>
    <!-- the rolled end, a fat cylinder at the left with its coil showing -->
    <path d="M 8 84 L 14 44 Q 30 32 46 40 L 44 78 Q 26 90 8 84 Z" fill="url(#rest-wool)" stroke-width="3"/>
    <ellipse cx="46" cy="58" rx="12" ry="18" fill="url(#rest-wool)" stroke-width="3"/>
    <ellipse cx="46" cy="58" rx="6" ry="9" fill="none" stroke="#5e5540" stroke-width="2.4"/>
    <ellipse cx="46" cy="58" rx="2" ry="3" fill="#3b3427" stroke="none"/>
    <path d="M 16 48 Q 26 42 36 44" fill="none" stroke="#e9e0c4" stroke-width="2.2" opacity="0.8"/>
    <!-- the straps round the roll -->
    <path d="M 22 44 L 20 86 M 36 40 L 34 82" fill="none" stroke="#1a0e08" stroke-width="7"/>
    <path d="M 22 44 L 20 86 M 36 40 L 34 82" fill="none" stroke="url(#rest-strap)" stroke-width="4"/>
    <!-- the turned-back corner at the far end -->
    <path d="M 96 62 L 120 78 L 112 60 Z" fill="url(#rest-wool)" stroke-width="2.6"/>
  </g>
</svg>
