<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-fence-plot: a maul splitting a rail, the wedge driven and the split opening. Claude-drawn stand-in; replace with
       Astra's icon-fence-plot (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="fence-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b27a"/><stop offset="0.5" stop-color="#a5784b"/><stop offset="1" stop-color="#5e3d1e"/></linearGradient>
    <linearGradient id="fence-maul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7048"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="fence-handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#6a4525"/></linearGradient>
    <linearGradient id="fence-wedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0a29c"/><stop offset="1" stop-color="#2f312e"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- the ground -->
    <ellipse cx="64" cy="114" rx="58" ry="8" fill="#7a6a4a" stroke-width="2.6"/>
    <!-- the rail, lying across, split open at the near end -->
    <path d="M 6 92 L 96 78 L 122 84 L 122 100 L 96 106 L 6 108 Z" fill="url(#fence-rail)" stroke-width="3"/>
    <path d="M 10 96 L 90 84" fill="none" stroke="#e8c898" stroke-width="2" opacity="0.7"/>
    <path d="M 12 104 L 88 100" fill="none" stroke="#4b3018" stroke-width="1.8" opacity="0.6"/>
    <!-- the split: a dark crack running from the wedge back along the rail -->
    <path d="M 60 92 L 92 90 L 122 92 L 122 94 L 92 96 Z" fill="#2a1a10" stroke-width="2"/>
    <!-- the wedge, driven into the split -->
    <path d="M 86 76 L 104 76 L 98 96 L 92 96 Z" fill="url(#fence-wedge)" stroke-width="2.8"/>
    <path d="M 88 80 L 92 92" fill="none" stroke="#e6e8e2" stroke-width="2" opacity="0.9"/>
    <!-- the maul coming down on the wedge from the upper left -->
    <g transform="rotate(-30 70 40)">
      <path d="M 14 40 L 70 40" fill="none" stroke="#1a0e08" stroke-width="10"/>
      <path d="M 14 40 L 70 40" fill="none" stroke="url(#fence-handle)" stroke-width="6"/>
      <path d="M 66 22 L 92 22 L 94 58 L 64 58 Z" fill="url(#fence-maul)" stroke-width="3"/>
      <path d="M 68 26 L 88 26" fill="none" stroke="#c49463" stroke-width="2" opacity="0.7"/>
      <path d="M 70 50 L 90 50" fill="none" stroke="#2a1a10" stroke-width="2" opacity="0.6"/>
    </g>
  </g>
</svg>
