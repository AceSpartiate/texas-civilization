<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-plant-field: a hand dropping seed into a furrow of turned earth. Claude-drawn stand-in; replace with Astra's
       icon-plant-field (request 2026-09-15, action icons). -->
  <defs>
    <linearGradient id="plant-earth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c6a44"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="plant-furrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a10"/><stop offset="1" stop-color="#5a3a1e"/></linearGradient>
    <linearGradient id="plant-sleeve" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9512d"/><stop offset="1" stop-color="#6e2f18"/></linearGradient>
    <linearGradient id="plant-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6b98c"/><stop offset="1" stop-color="#b8845a"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <!-- turned earth in ridges, and the open furrow down the middle -->
    <path d="M 4 124 L 4 84 Q 34 70 64 82 Q 94 94 124 80 L 124 124 Z" fill="url(#plant-earth)" stroke-width="3"/>
    <path d="M 10 100 Q 34 88 60 96 M 68 104 Q 94 108 118 96" fill="none" stroke="#c49463" stroke-width="2.2" opacity="0.6"/>
    <path d="M 14 116 Q 34 106 58 112 M 70 118 Q 96 122 118 112" fill="none" stroke="#2a1a10" stroke-width="2" opacity="0.6"/>
    <path d="M 56 124 Q 50 100 62 80 Q 74 100 70 124 Z" fill="url(#plant-furrow)" stroke-width="3"/>
    <!-- the seeds falling -->
    <ellipse cx="60" cy="66" rx="4" ry="3" fill="#e8c46a" stroke-width="2"/>
    <ellipse cx="66" cy="78" rx="4" ry="3" fill="#e8c46a" stroke-width="2"/>
    <ellipse cx="62" cy="92" rx="4" ry="3" fill="#e8c46a" stroke-width="2"/>
    <ellipse cx="66" cy="106" rx="4" ry="3" fill="#e8c46a" stroke-width="2"/>
    <!-- the hand above, fingers pinched, sleeve running off the upper left -->
    <path d="M 4 4 L 36 4 L 52 30 L 22 40 Z" fill="url(#plant-sleeve)" stroke-width="3"/>
    <path d="M 30 32 Q 46 20 62 28 Q 72 34 68 44 Q 66 50 60 52 L 62 58 Q 58 62 54 56 L 50 50 Q 40 50 34 44 Z" fill="url(#plant-skin)" stroke-width="2.8"/>
    <path d="M 58 40 Q 64 42 66 48" fill="none" stroke="#9a6a44" stroke-width="1.6" opacity="0.7"/>
    <path d="M 36 32 Q 46 26 56 28" fill="none" stroke="#f6d9b8" stroke-width="1.8" opacity="0.8"/>
  </g>
</svg>
