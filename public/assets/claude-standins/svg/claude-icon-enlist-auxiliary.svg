<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- icon-enlist-auxiliary: the same recruiting table, with a folded land certificate under a red wax seal in place of the
       roll. Claude-drawn stand-in; replace with Astra's icon-enlist-auxiliary (request 2026-09-16, the winter's icons). -->
  <defs>
    <linearGradient id="enaux-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c49463"/><stop offset="1" stop-color="#8c6238"/></linearGradient>
    <linearGradient id="enaux-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5534"/><stop offset="1" stop-color="#4b3018"/></linearGradient>
    <linearGradient id="enaux-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1d8"/><stop offset="1" stop-color="#dcc79c"/></linearGradient>
    <linearGradient id="enaux-fold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9dcb8"/><stop offset="1" stop-color="#c9b48a"/></linearGradient>
    <radialGradient id="enaux-seal" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#d8583a"/><stop offset="1" stop-color="#7e2412"/></radialGradient>
    <linearGradient id="enaux-ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f57"/><stop offset="1" stop-color="#1e2126"/></linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round" stroke="#1a0e08">
    <path d="M 20 88 L 20 118 L 30 118 L 30 90 Z" fill="url(#enaux-front)" stroke-width="3"/>
    <path d="M 98 88 L 98 118 L 108 118 L 108 90 Z" fill="url(#enaux-front)" stroke-width="3"/>
    <path d="M 14 78 L 114 78 L 114 92 L 14 92 Z" fill="url(#enaux-front)" stroke-width="3"/>
    <path d="M 22 58 L 106 58 L 118 80 L 10 80 Z" fill="url(#enaux-top)" stroke-width="3"/>
    <path d="M 26 62 L 100 62" fill="none" stroke="#e0b98a" stroke-width="2" opacity="0.7"/>
    <path d="M 18 73 L 110 73" fill="none" stroke="#6a4525" stroke-width="1.4" opacity="0.6"/>
    <!-- the certificate, folded in three, its top flap turned down over a red seal; tilted a little on the table -->
    <g transform="rotate(-8 60 56)">
      <path d="M 30 36 L 88 36 L 92 74 L 26 74 Z" fill="url(#enaux-paper)" stroke-width="2.8"/>
      <path d="M 30 36 L 88 36 L 80 54 L 38 54 Z" fill="url(#enaux-fold)" stroke-width="2.8"/>
      <path d="M 36 62 L 60 62 M 36 68 L 54 68" fill="none" stroke="#6b5a3e" stroke-width="2.2" opacity="0.8"/>
      <circle cx="59" cy="56" r="8.5" fill="url(#enaux-seal)" stroke-width="2.6"/>
      <path d="M 55 53 Q 58 50 62 53" fill="none" stroke="#f0a58a" stroke-width="1.6" opacity="0.8"/>
    </g>
    <path d="M 92 60 L 112 60 L 110 78 L 94 78 Z" fill="url(#enaux-ink)" stroke-width="2.8"/>
    <ellipse cx="102" cy="60" rx="10" ry="3.5" fill="#6b7078" stroke-width="2.4"/>
    <path d="M 100 66 L 94 22" fill="none" stroke="#1a0e08" stroke-width="7"/>
    <path d="M 100 66 L 94 22" fill="none" stroke="#e9dcb8" stroke-width="3.6"/>
    <path d="M 95 20 C 84 22 82 34 86 44 C 92 40 94 30 95 20 Z" fill="#f2e6c8" stroke-width="2.6"/>
    <path d="M 95 20 C 104 24 106 36 100 46 C 96 40 95 30 95 20 Z" fill="#d9c9a4" stroke-width="2.6"/>
    <path d="M 95 22 L 98 44" fill="none" stroke="#9c8a62" stroke-width="1.6"/>
  </g>
</svg>
