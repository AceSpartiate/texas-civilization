<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- mark-idle: a tan broad-brim hat hung on a wooden wall peg. Request 2026-09-16, the family panel's marks. -->
  <defs>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.08  0 0 0 0 0.02  0 0 0 0.5 -0.21" result="specks"/>
      <feComposite in="specks" in2="SourceGraphic" operator="in" result="clipped"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="clipped"/></feMerge>
    </filter>
    <linearGradient id="crownSide" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#bd955c"/>
      <stop offset="0.3" stop-color="#d4b075"/>
      <stop offset="0.65" stop-color="#c7a066"/>
      <stop offset="1" stop-color="#8c683d"/>
    </linearGradient>
    <linearGradient id="brimTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b67a"/>
      <stop offset="0.5" stop-color="#c79f64"/>
      <stop offset="1" stop-color="#957044"/>
    </linearGradient>
    <radialGradient id="crownShadow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(2 14) scale(31 9)">
      <stop offset="0.55" stop-color="#5a3f24" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5a3f24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8865a"/>
      <stop offset="0.5" stop-color="#8f6d44"/>
      <stop offset="1" stop-color="#5e4529"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1764a"/>
      <stop offset="0.6" stop-color="#7d5533"/>
      <stop offset="1" stop-color="#553619"/>
    </linearGradient>
    <linearGradient id="pegShaft" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="rotate(-66 27 44)">
      <stop offset="0" stop-color="#b3865a"/>
      <stop offset="0.45" stop-color="#835a36"/>
      <stop offset="1" stop-color="#4c3018"/>
    </linearGradient>
  </defs>
  <g filter="url(#grain)" stroke-linejoin="round" stroke-linecap="round">
    <!-- peg shaft, from the wall block down behind the hat's brim -->
    <line x1="20" y1="26" x2="33" y2="62" stroke="#1a0e08" stroke-width="10"/>
    <line x1="20" y1="26" x2="33" y2="62" stroke="url(#pegShaft)" stroke-width="6.6"/>
    <line x1="18" y1="27" x2="30" y2="59" stroke="#c39867" stroke-width="1.4" opacity="0.75"/>
    <!-- a piece of the wall plank the peg is set in -->
    <rect x="5" y="11" width="32" height="15" rx="2.5" fill="url(#block)" stroke="#1a0e08" stroke-width="2.2"/>
    <path d="M 8 16.5 Q 16 15 24 16.5 T 34 17" fill="none" stroke="#5a3a1e" stroke-width="1.1" opacity="0.8"/>
    <path d="M 8 21.5 Q 18 23.5 34 21.5" fill="none" stroke="#5a3a1e" stroke-width="1.1" opacity="0.8"/>
    <path d="M 7.5 13.3 Q 21 12 34.5 13.3" fill="none" stroke="#c39867" stroke-width="1.3" opacity="0.8"/>
    <ellipse cx="20.5" cy="24" rx="5.2" ry="2.4" fill="#3a2412" opacity="0.8"/>
    <!-- the hat, hanging at a tilt, seen a little from above: low rounded crown, wide brim -->
    <g transform="translate(54 55) rotate(-16)">
      <!-- brim -->
      <ellipse cx="0" cy="13" rx="38" ry="13" fill="url(#brimTop)" stroke="#1a0e08" stroke-width="2.3"/>
      <ellipse cx="0" cy="13" rx="38" ry="13" fill="url(#crownShadow)"/>
      <path d="M -35 9 Q -27 2.5 -12 1.2" fill="none" stroke="#ecd6a0" stroke-width="1.7" opacity="0.9"/>
      <path d="M -31 20.5 Q -8 26.5 16 24.5" fill="none" stroke="#6f5230" stroke-width="1.1" opacity="0.55"/>
      <!-- crown: a low rounded mound with a pinched dent on top -->
      <path d="M -21 15 C -22 4 -19 -8 -11 -12 Q 0 -15 11 -12 C 19 -8 22 4 21 15 Q 0 21.5 -21 15 Z" fill="url(#crownSide)" stroke="#1a0e08" stroke-width="2.3"/>
      <path d="M -7 -10.5 Q -3 -13 0 -12.5 Q 3 -13 7 -10.5" fill="none" stroke="#7d5c36" stroke-width="1.3" opacity="0.85"/>
      <path d="M -4 -9.5 Q 0 -7 4 -9.5" fill="none" stroke="#9e7b4d" stroke-width="1" opacity="0.6"/>
      <!-- band: a thin darker tan strip round the base of the crown -->
      <path d="M -21 8 Q 0 14.5 21 8 L 21.2 12 Q 0 18.5 -21.2 12 Z" fill="url(#band)" stroke="#1a0e08" stroke-width="1.1"/>
      <!-- highlights: lit left of the crown and the top -->
      <path d="M -15 -5 Q -16 1 -16 6" fill="none" stroke="#ecd6a0" stroke-width="1.9" opacity="0.8"/>
      <path d="M -12 -9.5 Q -6 -12.5 2 -12.2" fill="none" stroke="#f2e0b0" stroke-width="1.5" opacity="0.75"/>
    </g>
  </g>
</svg>
